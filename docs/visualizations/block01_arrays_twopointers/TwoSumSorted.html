<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Two Sum (отсортированный) — визуализация двух указателей</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --cell:#232733; --line:#2e3342;
    --txt:#e6e8ee; --muted:#8b90a0; --accent:#4f8cff; --l:#38bdf8; --r:#fb7185;
    --ok:#34d399; --warn:#fbbf24; --code:#c7d0e0;
    --mono:"JetBrains Mono",Consolas,Menlo,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}
  h1{font-size:18px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  .stage{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:26px 22px}
  .setup{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
  .setup label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .setup input{font-family:var(--mono);font-size:14px;background:var(--cell);
       border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px}
  .setup input[type=text]{width:230px}
  .setup input[type=number]{width:90px}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
       background:var(--cell);border:1px solid var(--line);color:var(--txt);
       border-radius:8px;padding:9px 14px;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .array{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:34px 0 12px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
  .cell{width:58px;height:58px;border-radius:10px;background:var(--cell);
        border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:20px;transition:.25s}
  .cell.l{border-color:var(--l);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .cell.r{border-color:var(--r);box-shadow:0 0 0 3px rgba(251,113,133,.15)}
  .cell.lr{border-color:var(--warn)}
  .cell.hit{border-color:var(--ok);background:rgba(52,211,153,.15)}
  .cell.dim{opacity:.35}
  .idx{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ptr{height:20px;font-family:var(--mono);font-size:12px;font-weight:700}
  .ptr.l{color:var(--l)} .ptr.r{color:var(--r)}

  .status{min-height:26px;text-align:center;font-family:var(--mono);font-size:15px;margin:14px 0 6px}
  .status .op{color:var(--code)}
  .status .good{color:var(--ok)} .status .lo{color:var(--l)} .status .hi{color:var(--r)}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
  .step-info{color:var(--muted);font-size:12px;font-family:var(--mono);min-width:90px;text-align:center}

  .codebox{margin-top:22px;background:#0b0d13;border:1px solid var(--line);border-radius:10px;
           padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow:auto}
  .codebox .ln{display:block;padding:0 6px;border-radius:4px;color:var(--code);white-space:pre}
  .codebox .ln.active{background:rgba(79,140,255,.18)}
  .kw{color:#c792ea}.num{color:#f78c6c}.cm{color:#5c6370}
</style>
</head>
<body>
  <h1>Two Sum II — два указателя</h1>
  <div class="sub">Отсортированный массив, ищем пару с суммой target. Индексы 1-based — нумерация с единицы: первый элемент — 1, а не 0 (LeetCode 167).</div>

  <div class="stage">
    <div class="setup">
      <label>Массив (через запятую, отсортирован)
        <input id="arrIn" type="text" value="2, 7, 11, 15">
      </label>
      <label>target
        <input id="tgtIn" type="number" value="9">
      </label>
      <button class="btn primary" id="build">Построить</button>
    </div>

    <div class="array" id="array"></div>
    <div class="status" id="status"></div>

    <div class="controls">
      <button class="btn" id="prev">◀ Назад</button>
      <span class="step-info" id="stepInfo">шаг 0 / 0</span>
      <button class="btn" id="next">Вперёд ▶</button>
      <button class="btn" id="play">▶ Авто</button>
      <button class="btn" id="reset">⟲ Сброс</button>
    </div>

    <div class="codebox" id="code"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let nums=[], target=0, steps=[], cur=0, timer=null;

const CODE = [
  {t:`<span class="kw">int</span> l = <span class="num">0</span>, r = nums.length - <span class="num">1</span>;`, line:'init'},
  {t:`<span class="kw">while</span> (l < r) {`, line:'while'},
  {t:`    <span class="kw">int</span> sum = nums[l] + nums[r];`, line:'sum'},
  {t:`    <span class="kw">if</span> (sum == target) <span class="kw">return</span> {l+<span class="num">1</span>, r+<span class="num">1</span>};`, line:'eq'},
  {t:`    <span class="kw">if</span> (sum &lt; target) l++;`, line:'lt'},
  {t:`    <span class="kw">else</span> r--;`, line:'gt'},
  {t:`}`, line:'end'},
];

function buildSteps(){
  steps=[]; let l=0, r=nums.length-1;
  steps.push({l,r,line:'init',msg:`l = 0, r = ${r}`});
  while(l<r){
    steps.push({l,r,line:'while',msg:`l (${l}) < r (${r})? — да, продолжаем`});
    const sum=nums[l]+nums[r];
    steps.push({l,r,line:'sum',sum,msg:`sum = nums[${l}] + nums[${r}] = ${nums[l]} + ${nums[r]} = ${sum}`});
    if(sum===target){
      steps.push({l,r,line:'eq',sum,hit:true,msg:`sum == target → нашли: индексы [${l+1}, ${r+1}]`});
      return;
    }
    if(sum<target){
      steps.push({l,r,line:'lt',sum,msg:`sum (${sum}) &lt; target (${target}) → сдвигаем l вправо`});
      l++;
    } else {
      steps.push({l,r,line:'gt',sum,msg:`sum (${sum}) &gt; target (${target}) → сдвигаем r влево`});
      r--;
    }
  }
  steps.push({l,r,line:'end',msg:`l >= r — пара не найдена`});
}

function renderArray(s){
  const wrap=$('array'); wrap.innerHTML='';
  nums.forEach((v,i)=>{
    const col=document.createElement('div'); col.className='col';
    const pl=document.createElement('div');
    pl.className='ptr l'; pl.textContent=(i===s.l?'L':'');
    const cell=document.createElement('div'); cell.className='cell'; cell.textContent=v;
    if(i===s.l&&i===s.r) cell.classList.add('lr');
    else if(i===s.l) cell.classList.add('l');
    else if(i===s.r) cell.classList.add('r');
    else if(i<s.l||i>s.r) cell.classList.add('dim');
    if(s.hit&&(i===s.l||i===s.r)) cell.classList.add('hit');
    const pr=document.createElement('div');
    pr.className='ptr r'; pr.textContent=(i===s.r?'R':'');
    const idx=document.createElement('div'); idx.className='idx'; idx.textContent=i;
    col.append(pl,cell,pr,idx); wrap.append(col);
  });
}

function renderCode(active){
  $('code').innerHTML = CODE.map(c=>
    `<span class="ln ${c.line===active?'active':''}">${c.t}</span>`).join('');
}

function show(i){
  cur=Math.max(0,Math.min(i,steps.length-1));
  const s=steps[cur];
  renderArray(s); renderCode(s.line);
  $('status').innerHTML = s.hit
      ? `<span class="good">✓ ${s.msg}</span>`
      : `<span class="op">${s.msg}</span>`;
  $('stepInfo').textContent=`шаг ${cur+1} / ${steps.length}`;
  $('prev').disabled=cur===0; $('next').disabled=cur===steps.length-1;
}

function build(){
  stopPlay();
  nums = $('arrIn').value.split(',').map(x=>parseInt(x.trim(),10)).filter(x=>!isNaN(x));
  target = parseInt($('tgtIn').value,10);
  if(nums.length<2){$('status').textContent='Нужно минимум 2 числа';return;}
  buildSteps(); show(0);
}
function stopPlay(){ if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Авто';} }
function togglePlay(){
  if(timer){stopPlay();return;}
  if(cur>=steps.length-1) show(0);
  $('play').textContent='⏸ Пауза';
  timer=setInterval(()=>{ if(cur>=steps.length-1){stopPlay();return;} show(cur+1); },900);
}

$('build').onclick=build;
$('next').onclick=()=>{stopPlay();show(cur+1);};
$('prev').onclick=()=>{stopPlay();show(cur-1);};
$('play').onclick=togglePlay;
$('reset').onclick=()=>{stopPlay();show(0);};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();show(cur+1);}
  if(e.key==='ArrowLeft'){stopPlay();show(cur-1);}
  if(e.key===' '){e.preventDefault();togglePlay();}
});
build();
</script>
</body>
</html>
