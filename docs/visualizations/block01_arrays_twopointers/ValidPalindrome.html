<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valid Palindrome — визуализация двух указателей</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --cell:#232733; --line:#2e3342;
    --txt:#e6e8ee; --muted:#8b90a0; --accent:#4f8cff; --l:#38bdf8; --r:#fb7185;
    --ok:#34d399; --warn:#fbbf24; --bad:#f87171; --code:#c7d0e0;
    --mono:"JetBrains Mono",Consolas,Menlo,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}
  h1{font-size:18px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;text-align:center;max-width:760px}
  .stage{width:min(980px,100%);background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:26px 22px}
  .setup{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
  .setup label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .setup input{font-family:var(--mono);font-size:14px;background:var(--cell);
       border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px}
  .setup input[type=text]{width:340px}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
       background:var(--cell);border:1px solid var(--line);color:var(--txt);
       border-radius:8px;padding:9px 14px;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .array{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:30px 0 12px}
  .col{display:flex;flex-direction:column;align-items:center;gap:5px;position:relative}
  .cell{width:40px;height:40px;border-radius:8px;background:var(--cell);
        border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:16px;transition:.25s}
  .cell.junk{opacity:.45;border-style:dashed}
  .cell.l{border-color:var(--l);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .cell.r{border-color:var(--r);box-shadow:0 0 0 3px rgba(251,113,133,.15)}
  .cell.lr{border-color:var(--warn)}
  .cell.match{border-color:var(--ok);background:rgba(52,211,153,.15)}
  .cell.mismatch{border-color:var(--bad);background:rgba(248,113,113,.15)}
  .cell.done{opacity:.35}
  .idx{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .ptr{height:18px;font-family:var(--mono);font-size:12px;font-weight:700}
  .ptr.l{color:var(--l)} .ptr.r{color:var(--r)}

  .status{min-height:26px;text-align:center;font-family:var(--mono);font-size:14px;margin:14px 0 6px}
  .status .op{color:var(--code)}
  .status .good{color:var(--ok)} .status .bad{color:var(--bad)}
  .status .skip{color:var(--warn)}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
  .step-info{color:var(--muted);font-size:12px;font-family:var(--mono);min-width:90px;text-align:center}

  .codebox{margin-top:22px;background:#0b0d13;border:1px solid var(--line);border-radius:10px;
           padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.7;overflow:auto}
  .codebox .ln{display:block;padding:0 6px;border-radius:4px;color:var(--code);white-space:pre}
  .codebox .ln.active{background:rgba(79,140,255,.18)}
  .kw{color:#c792ea}.num{color:#f78c6c}.cm{color:#5c6370}.str{color:#c3e88d}
</style>
</head>
<body>
  <h1>Valid Palindrome — два указателя</h1>
  <div class="sub">Учитываем только буквы и цифры, регистр игнорируем. Пунктирные ячейки — «мусорные» символы,
    их проматывают вложенные циклы. Жёлтая подсветка статуса — работа промотки.</div>

  <div class="stage">
    <div class="setup">
      <label>Строка
        <input id="strIn" type="text" value="A man, a plan: Panama">
      </label>
      <button class="btn primary" id="build">Построить</button>
    </div>

    <div class="array" id="array"></div>
    <div class="status" id="status"></div>

    <div class="controls">
      <button class="btn" id="prev">◀ Назад</button>
      <span class="step-info" id="stepInfo">шаг 0 / 0</span>
      <button class="btn" id="next">Вперёд ▶</button>
      <button class="btn" id="play">▶ Авто</button>
      <button class="btn" id="reset">⟲ Сброс</button>
    </div>

    <div class="codebox" id="code"></div>
  </div>

<script>
const $ = id => document.getElementById(id);
let chars=[], steps=[], cur=0, timer=null;

const CODE = [
  {t:`<span class="kw">int</span> leftIndex = <span class="num">0</span>, rightIndex = s.length() - <span class="num">1</span>;`, line:'init'},
  {t:`<span class="kw">while</span> (leftIndex &lt; rightIndex) {`, line:'while'},
  {t:`    <span class="kw">while</span> (leftIndex &lt; rightIndex &amp;&amp; !isLetterOrDigit(s.charAt(leftIndex))) leftIndex++;`, line:'skipL'},
  {t:`    <span class="kw">while</span> (leftIndex &lt; rightIndex &amp;&amp; !isLetterOrDigit(s.charAt(rightIndex))) rightIndex--;`, line:'skipR'},
  {t:`    <span class="kw">if</span> (toLowerCase(s.charAt(leftIndex)) != toLowerCase(s.charAt(rightIndex)))`, line:'cmp'},
  {t:`        <span class="kw">return</span> <span class="kw">false</span>;`, line:'false'},
  {t:`    leftIndex++; rightIndex--;`, line:'move'},
  {t:`}`, line:'end'},
  {t:`<span class="kw">return</span> <span class="kw">true</span>; <span class="cm">// все пары совпали — опровержение не найдено</span>`, line:'true'},
];

const isAlnum = ch => /[\p{L}\p{N}]/u.test(ch);

function buildSteps(){
  steps=[]; let l=0, r=chars.length-1;
  steps.push({l,r,line:'init',msg:`leftIndex = 0, rightIndex = ${r}`});
  while(l<r){
    steps.push({l,r,line:'while',msg:`leftIndex (${l}) < rightIndex (${r})? — да, продолжаем`});
    while(l<r && !isAlnum(chars[l])){
      steps.push({l,r,line:'skipL',skip:true,msg:`'${chars[l]}' — не буква/цифра → промотка: leftIndex++`});
      l++;
    }
    while(l<r && !isAlnum(chars[r])){
      steps.push({l,r,line:'skipR',skip:true,msg:`'${chars[r]}' — не буква/цифра → промотка: rightIndex--`});
      r--;
    }
    const a=chars[l].toLowerCase(), b=chars[r].toLowerCase();
    if(a!==b){
      steps.push({l,r,line:'cmp',msg:`сравниваем '${a}' и '${b}'`});
      steps.push({l,r,line:'false',mismatch:true,msg:`'${a}' != '${b}' → return false (одно несовпадение опровергает всё)`});
      return;
    }
    steps.push({l,r,line:'cmp',match:true,msg:`сравниваем '${a}' и '${b}' — совпали`});
    steps.push({l,r,line:'move',match:true,msg:`пара проверена → leftIndex++, rightIndex--`});
    l++; r--;
  }
  steps.push({l,r,line:'end',msg:`leftIndex >= rightIndex — непроверенных пар не осталось`});
  steps.push({l,r,line:'true',ok:true,msg:`return true — палиндром (фолбэк после цикла)`});
}

function renderArray(s){
  const wrap=$('array'); wrap.innerHTML='';
  chars.forEach((ch,i)=>{
    const col=document.createElement('div'); col.className='col';
    const pl=document.createElement('div');
    pl.className='ptr l'; pl.textContent=(i===s.l?'L':'');
    const cell=document.createElement('div'); cell.className='cell';
    cell.textContent = ch===' ' ? '␣' : ch;
    if(!isAlnum(ch)) cell.classList.add('junk');
    if(i===s.l&&i===s.r) cell.classList.add('lr');
    else if(i===s.l) cell.classList.add('l');
    else if(i===s.r) cell.classList.add('r');
    else if(i<s.l||i>s.r) cell.classList.add('done');
    if(s.match&&(i===s.l||i===s.r)) cell.classList.add('match');
    if(s.mismatch&&(i===s.l||i===s.r)) cell.classList.add('mismatch');
    if(s.ok) cell.classList.add('match');
    const pr=document.createElement('div');
    pr.className='ptr r'; pr.textContent=(i===s.r?'R':'');
    const idx=document.createElement('div'); idx.className='idx'; idx.textContent=i;
    col.append(pl,cell,pr,idx); wrap.append(col);
  });
}

function renderCode(active){
  $('code').innerHTML = CODE.map(c=>
    `<span class="ln ${c.line===active?'active':''}">${c.t}</span>`).join('');
}

function show(i){
  cur=Math.max(0,Math.min(i,steps.length-1));
  const s=steps[cur];
  renderArray(s); renderCode(s.line);
  let cls='op';
  if(s.ok) cls='good';
  else if(s.mismatch) cls='bad';
  else if(s.skip) cls='skip';
  $('status').innerHTML = `<span class="${cls}">${s.ok?'✓ ':''}${s.mismatch?'✗ ':''}${s.msg}</span>`;
  $('stepInfo').textContent=`шаг ${cur+1} / ${steps.length}`;
  $('prev').disabled=cur===0; $('next').disabled=cur===steps.length-1;
}

function build(){
  stopPlay();
  chars = Array.from($('strIn').value);
  if(chars.length===0){$('status').textContent='Введи строку';return;}
  buildSteps(); show(0);
}
function stopPlay(){ if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Авто';} }
function togglePlay(){
  if(timer){stopPlay();return;}
  if(cur>=steps.length-1) show(0);
  $('play').textContent='⏸ Пауза';
  timer=setInterval(()=>{ if(cur>=steps.length-1){stopPlay();return;} show(cur+1); },800);
}

$('build').onclick=build;
$('next').onclick=()=>{stopPlay();show(cur+1);};
$('prev').onclick=()=>{stopPlay();show(cur-1);};
$('play').onclick=togglePlay;
$('reset').onclick=()=>{stopPlay();show(0);};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){stopPlay();show(cur+1);}
  if(e.key==='ArrowLeft'){stopPlay();show(cur-1);}
  if(e.key===' '){e.preventDefault();togglePlay();}
});
build();
</script>
</body>
</html>
