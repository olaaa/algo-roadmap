<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valid Parentheses — визуализация прохода со стеком</title>
<style>
  :root{
    --bg:#0f1117; --panel:#171a23; --cell:#232733; --line:#2e3342;
    --txt:#e6e8ee; --muted:#8b90a0; --accent:#4f8cff; --cur:#38bdf8; --comp:#fbbf24;
    --ok:#34d399; --miss:#fb7185; --code:#c7d0e0;
    --mono:"JetBrains Mono",Consolas,Menlo,monospace;
    --sans:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);
       display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px}
  h1{font-size:18px;font-weight:600;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;max-width:760px;text-align:center}
  .stage{width:min(880px,100%);background:var(--panel);border:1px solid var(--line);
         border-radius:14px;padding:26px 22px}
  .setup{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px}
  .setup label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .setup input{font-family:var(--mono);font-size:14px;background:var(--cell);
       border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px}
  .setup input[type=text]{width:230px}
  .btn{font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;
       background:var(--cell);border:1px solid var(--line);color:var(--txt);
       border-radius:8px;padding:9px 14px;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .preset{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  .preset .btn{padding:6px 11px;font-family:var(--mono);font-size:12px}

  .array{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:26px 0 8px;min-height:96px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .cell{width:52px;height:52px;border-radius:10px;background:var(--cell);
        border:2px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-family:var(--mono);font-size:24px;transition:.25s}
  .cell.cur{border-color:var(--cur);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .cell.seen{opacity:.5}
  .cell.hit{border-color:var(--ok);background:rgba(52,211,153,.15);opacity:1}
  .cell.bad{border-color:var(--miss);background:rgba(251,113,133,.18);opacity:1}
  .idx{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .ptr{height:20px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cur)}
  .empty-str{font-family:var(--mono);font-size:13px;color:var(--muted);font-style:italic;
             align-self:center;padding:34px 0}

  .stackbox{background:#0b0d13;border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .stackbox .cap{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:var(--mono)}
  .stackbox .cap b{color:var(--code);font-weight:600}
  .stackcells{display:flex;flex-direction:column-reverse;gap:7px;align-items:flex-start;min-height:56px}
  .srow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .scell{width:46px;height:40px;border-radius:8px;background:var(--cell);border:1px solid var(--line);
         display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--txt);
         transition:.2s}
  .scell.top{border-color:var(--cur);box-shadow:0 0 0 2px rgba(56,189,248,.15)}
  .scell.pushed{border-color:var(--cur);background:rgba(56,189,248,.15)}
  .scell.popped{border-color:var(--comp);background:rgba(251,191,36,.15)}
  .scell.matched{border-color:var(--ok);background:rgba(52,211,153,.18)}
  .scell.mismatched{border-color:var(--miss);background:rgba(251,113,133,.18)}
  .stack-empty{font-family:var(--mono);font-size:12.5px;color:#4b5163;font-style:italic;padding:14px 2px}

  .status{min-height:26px;text-align:center;font-family:var(--mono);font-size:14px;margin:16px 0 6px}
  .status .op{color:var(--code)}
  .status .good{color:var(--ok)} .status .comp{color:var(--comp)} .status .miss{color:var(--miss)}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
  .step-info{color:var(--muted);font-size:12px;font-family:var(--mono);min-width:90px;text-align:center}

  .codebox{background:#0b0d13;border:1px solid var(--line);border-radius:10px;
           padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.7;overflow:auto}
  .codebox .ln{display:block;padding:0 6px;border-radius:4px;color:var(--code);white-space:pre}
  .codebox .ln.active{background:rgba(79,140,255,.18)}
  .kw{color:#c792ea}.num{color:#f78c6c}.cm{color:#5c6370}.str{color:#c3e88d}

  .cols{display:flex;gap:18px;align-items:flex-start;margin-top:18px;flex-wrap:wrap}
  .cols .stackbox{flex:1 1 300px;min-width:0}
  .cols .codebox{flex:1 1 420px;min-width:280px}

</style>
</head>
<body>
  <h1>Valid Parentheses — проверка скобок через стек</h1>
  <div class="sub">Закрывающая скобка обязана закрыть <b>последнюю</b> из ещё не закрытых открытых — это ровно поведение стека. Открывающую кладём в стек, закрывающей снимаем верхнюю и сверяем тип (LeetCode 20).</div>

  <div class="stage">
    <div class="setup">
      <label>Строка из скобок ()[]{}
        <input id="strIn" type="text" value="([{}])">
      </label>
      <button class="btn primary" id="build">Построить</button>
    </div>

    <div class="preset">
      <button class="btn" data-s="([{}])">([{}])</button>
      <button class="btn" data-s="()[]{}">()[]{}</button>
      <button class="btn" data-s="([)]">([)] — порядок</button>
      <button class="btn" data-s="(]">(] — тип</button>
      <button class="btn" data-s="(">( — не закрыта</button>
      <button class="btn" data-s=")">) — пустой стек</button>
      <button class="btn" data-s="">пустая строка</button>
    </div>

    <div class="array" id="array"></div>

    <div class="status" id="status"></div>

    <div class="cols">
      <div class="stackbox">
        <div class="cap">стек <b>openBrackets</b> (вершина сверху)</div>
        <div class="stackcells" id="stack"></div>
      </div>

      <div class="codebox" id="code"></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev">◀ Назад</button>
      <span class="step-info" id="stepInfo">шаг 0 / 0</span>
      <button class="btn" id="next">Вперёд ▶</button>
      <button class="btn" id="play">▶ Авто</button>
      <button class="btn" id="reset">⟲ Сброс</button>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
let input='', steps=[], cur=0, timer=null;

const CODE = [
  {t:`Deque&lt;Character&gt; openBrackets = <span class="kw">new</span> ArrayDeque&lt;&gt;();`, line:'init'},
  {t:`<span class="kw">for</span> (<span class="kw">int</span> i = <span class="num">0</span>; i &lt; s.length(); i++) {`, line:'for'},
  {t:`    <span class="kw">char</span> current = s.charAt(i);`, line:'char'},
  {t:`    <span class="kw">if</span> (isOpening(current)) {`, line:'if'},
  {t:`        openBrackets.push(current);`, line:'push'},
  {t:`    } <span class="kw">else</span> {`, line:'else'},
  {t:`        <span class="kw">if</span> (openBrackets.isEmpty()) {`, line:'empty'},
  {t:`            <span class="kw">return false</span>;`, line:'retEmpty'},
  {t:`        }`, line:'endEmpty'},
  {t:`        <span class="kw">char</span> lastOpened = openBrackets.pop();`, line:'pop'},
  {t:`        <span class="kw">if</span> (!isMatchingPair(lastOpened, current)) {`, line:'match'},
  {t:`            <span class="kw">return false</span>;`, line:'retMismatch'},
  {t:`        }`, line:'endMatch'},
  {t:`    }`, line:'endElse'},
  {t:`}`, line:'endFor'},
  {t:`<span class="kw">return</span> openBrackets.isEmpty();`, line:'ret'},
];

const OPENING = '([{';
const PAIR = {'(':')', '[':']', '{':'}'};

function buildSteps(){
  steps=[];
  const stack=[];
  steps.push({i:-1, line:'init', stack:[], msg:'создаём пустой стек'});

  for(let i=0;i<input.length;i++){
    const current=input[i];
    steps.push({i, line:'for', stack:[...stack], msg:`i = ${i}`});
    steps.push({i, line:'char', stack:[...stack], msg:`current = '${current}'`});

    if(OPENING.includes(current)){
      steps.push({i, line:'if', stack:[...stack],
                  msg:`'${current}' — открывающая, кладём в стек`});
      stack.push(current);
      steps.push({i, line:'push', stack:[...stack], pushed:true,
                  msg:`push('${current}') → в стеке ${stack.length} шт., ждёт пару '${PAIR[current]}'`});
      continue;
    }

    steps.push({i, line:'else', stack:[...stack],
                msg:`'${current}' — закрывающая, идём в else`});

    if(stack.length===0){
      steps.push({i, line:'empty', stack:[], msg:'стек пуст — закрывать нечего'});
      steps.push({i, line:'retEmpty', stack:[], bad:true, done:true, result:false,
                  msg:`✗ false: закрывающая '${current}' без пары`});
      return;
    }
    steps.push({i, line:'empty', stack:[...stack], msg:'стек не пуст — можно снимать'});

    const lastOpened=stack.pop();
    steps.push({i, line:'pop', stack:[...stack], popped:lastOpened,
                msg:`pop() → сняли '${lastOpened}'`});

    if(PAIR[lastOpened]!==current){
      steps.push({i, line:'match', stack:[...stack], popped:lastOpened, mismatch:true,
                  msg:`'${lastOpened}' ждала '${PAIR[lastOpened]}', а пришла '${current}' — тип не совпал`});
      steps.push({i, line:'retMismatch', stack:[...stack], bad:true, done:true, result:false,
                  msg:`✗ false: пара '${lastOpened}${current}' некорректна`});
      return;
    }
    steps.push({i, line:'match', stack:[...stack], popped:lastOpened, matched:true, pairIndex:i,
                msg:`'${lastOpened}' и '${current}' — верная пара, идём дальше`});
  }

  const ok = stack.length===0;
  steps.push({i:input.length, line:'endFor', stack:[...stack], msg:'строка кончилась, цикл завершён'});
  steps.push({i:input.length, line:'ret', stack:[...stack], done:true, result:ok, bad:!ok, good:ok,
              msg: ok
                ? '✓ true: стек пуст — все скобки закрыты'
                : `✗ false: в стеке осталось ${stack.length} незакрытых — вот зачем нужен isEmpty(), а не голый true`});
}

function renderArray(s){
  const wrap=$('array'); wrap.innerHTML='';
  if(input.length===0){
    const box=document.createElement('div');
    box.className='empty-str';
    box.textContent='пустая строка — цикл не начнётся ни разу';
    wrap.append(box);
    return;
  }
  for(let i=0;i<input.length;i++){
    const col=document.createElement('div'); col.className='col';
    const ptr=document.createElement('div');
    ptr.className='ptr'; ptr.textContent=(i===s.i?'i':'');
    const cell=document.createElement('div'); cell.className='cell'; cell.textContent=input[i];
    if(i===s.i && s.bad){
      cell.classList.add('bad');
    } else if(i===s.i && s.matched){
      cell.classList.add('hit');
    } else if(i===s.i){
      cell.classList.add('cur');
    } else if(i<s.i){
      cell.classList.add('seen');
    }
    const idx=document.createElement('div'); idx.className='idx'; idx.textContent=i;
    col.append(ptr,cell,idx); wrap.append(col);
  }
}

/*
 * Контейнер #stack имеет flex-direction: column-reverse, поэтому ПЕРВЫЙ
 * добавленный элемент оказывается внизу, а последний — наверху. Значит порядок
 * добавления обязан совпадать с порядком «дно -> вершина»: сначала cells[0],
 * потом остальные, и в самом конце снятая скобка, которая рисуется над стеком.
 */
function renderStack(s){
  const box=$('stack'); box.innerHTML='';
  const cells=s.stack||[];

  if(cells.length===0 && s.popped===undefined){
    const nul=document.createElement('div'); nul.className='stack-empty';
    nul.textContent='стек пуст';
    box.append(nul);
    return;
  }

  cells.forEach((ch,pos)=>{
    const row=document.createElement('div'); row.className='srow';
    const cell=document.createElement('div'); cell.className='scell';
    cell.textContent=ch;
    /* Вершину подсвечиваем только когда над стеком не висит снятая скобка. */
    const isTop = pos===cells.length-1 && s.popped===undefined;
    if(isTop){
      cell.classList.add(s.pushed?'pushed':'top');
    }
    const lab=document.createElement('span');
    lab.textContent = isTop ? 'вершина' : '';
    row.append(cell,lab); box.append(row);
  });

  if(s.popped!==undefined){
    const row=document.createElement('div'); row.className='srow';
    const cell=document.createElement('div');
    cell.className='scell ' + (s.matched?'matched':s.mismatch?'mismatched':'popped');
    cell.textContent=s.popped;
    const lab=document.createElement('span');
    lab.textContent = s.matched ? 'снята с вершины, пара сошлась'
                    : s.mismatch ? 'снята с вершины, тип не тот'
                    : 'снята с вершины';
    row.append(cell,lab); box.append(row);
  }
}

function renderCode(active){
  $('code').innerHTML = CODE.map(c=>
    `<span class="ln ${c.line===active?'active':''}">${c.t}</span>`).join('');
}

function show(idx){
  cur=Math.max(0,Math.min(idx,steps.length-1));
  const s=steps[cur];
  renderArray(s); renderStack(s); renderCode(s.line);
  const cls = s.good ? 'good' : s.bad ? 'miss' : (s.matched||s.mismatch||s.popped!==undefined) ? 'comp' : 'op';
  $('status').innerHTML=`<span class="${cls}">${s.msg}</span>`;
  $('stepInfo').textContent=`шаг ${cur+1} / ${steps.length}`;
  $('prev').disabled=cur===0; $('next').disabled=cur===steps.length-1;
}

function build(){
  stopPlay();
  const raw=$('strIn').value.trim();
  const cleaned=[...raw].filter(ch=>'()[]{}'.includes(ch)).join('');
  if(cleaned.length!==raw.length){
    $('strIn').value=cleaned;
  }
  input=cleaned;
  buildSteps(); show(0);
}
function stopPlay(){ if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Авто';} }
function togglePlay(){
  if(timer){stopPlay();return;}
  if(cur>=steps.length-1) show(0);
  $('play').textContent='⏸ Пауза';
  timer=setInterval(()=>{ if(cur>=steps.length-1){stopPlay();return;} show(cur+1); },850);
}

$('build').onclick=build;
$('next').onclick=()=>{stopPlay();show(cur+1);};
$('prev').onclick=()=>{stopPlay();show(cur-1);};
$('play').onclick=togglePlay;
$('reset').onclick=()=>{stopPlay();show(0);};
document.querySelectorAll('.preset .btn').forEach(b=>{
  b.onclick=()=>{ $('strIn').value=b.dataset.s; build(); };
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.key==='ArrowRight'){stopPlay();show(cur+1);}
  if(e.key==='ArrowLeft'){stopPlay();show(cur-1);}
  if(e.key===' '){e.preventDefault();togglePlay();}
});
build();
</script>
</body>
</html>
