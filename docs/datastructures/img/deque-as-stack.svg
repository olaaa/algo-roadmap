<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="340" fill="#fbfcfe"/>
  <defs>
    <marker id="sIn" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#4f8cff"/>
    </marker>
    <marker id="sOut" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#e0567a"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Тот же Deque как стек: оба конца не нужны, работаем одним</text>
  <text x="380" y="54" text-anchor="middle" font-size="13" fill="#6b7280">push / pop / peek — это addFirst / removeFirst / peekFirst под другими именами</text>

  <!-- stack column -->
  <g font-family="Consolas, monospace">
    <rect x="300" y="96" width="160" height="52" rx="9" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2.4"/>
    <text x="380" y="128" text-anchor="middle" font-size="19" fill="#1c2333">C</text>

    <rect x="300" y="156" width="160" height="52" rx="9" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="380" y="188" text-anchor="middle" font-size="19" fill="#1c2333">B</text>

    <rect x="300" y="216" width="160" height="52" rx="9" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="380" y="248" text-anchor="middle" font-size="19" fill="#1c2333">A</text>
  </g>

  <text x="480" y="118" font-size="12.5" font-weight="600" fill="#4f8cff">вершина (first)</text>
  <text x="480" y="136" font-size="11.5" fill="#6b7280">её вернёт peek()</text>
  <text x="480" y="248" font-size="12.5" fill="#6b7280">дно — вошло первым</text>

  <!-- push -->
  <line x1="140" y1="86" x2="292" y2="112" stroke="#4f8cff" stroke-width="2.5" marker-end="url(#sIn)"/>
  <text x="140" y="76" font-size="13" font-family="Consolas, monospace" fill="#4f8cff">push(E)</text>
  <text x="140" y="60" font-size="11.5" fill="#6b7280">кладём НА вершину</text>

  <!-- pop -->
  <line x1="292" y1="132" x2="140" y2="158" stroke="#e0567a" stroke-width="2.5" marker-end="url(#sOut)"/>
  <text x="112" y="180" font-size="13" font-family="Consolas, monospace" fill="#e0567a">pop()</text>
  <text x="112" y="196" font-size="11.5" fill="#6b7280">снимаем С вершины</text>

  <text x="380" y="300" text-anchor="middle" font-size="12.5" fill="#6b7280">LIFO: последним вошёл — первым вышел. Порядок выхода C → B → A.</text>
  <text x="380" y="322" text-anchor="middle" font-size="12.5" fill="#6b7280">Именно так стек и делают в современной Java — класс Stack устарел.</text>
</svg>
