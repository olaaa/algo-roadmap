  <text x="430" y="358" text-anchor="middle" font-size="12" fill="#b45309" font-weight="600">индекс 5</text>
  <text x="380" y="382" text-anchor="middle" font-size="13" fill="#34a97a" font-weight="600">каждый родитель не больше своих потомков</text>
