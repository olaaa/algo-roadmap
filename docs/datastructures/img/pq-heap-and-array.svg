  <rect width="760" height="512" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Куча: дерево сверху, массив снизу</text>
  <text x="380" y="54" text-anchor="middle" font-size="13" fill="#6b7280">PriorityQueue после offer 5, 3, 8, 1, 9, 2</text>
