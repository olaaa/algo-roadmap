  <text x="476" y="466" text-anchor="middle" font-size="12" fill="#6b7280">4</text>
  <rect x="508" y="404" width="64" height="44" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="540" y="432" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">8</text>
