  <text x="170" y="466" text-anchor="end" font-size="12" fill="#6b7280">индексы</text>
  <text x="380" y="496" text-anchor="middle" font-size="13" fill="#b45309" font-weight="600">узел «2» стоит на индексе 2, его левый потомок «8» — на индексе 2 · 2 + 1 = 5</text>
