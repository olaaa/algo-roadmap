  <text x="284" y="466" text-anchor="middle" font-size="12" fill="#6b7280">1</text>
  <rect x="316" y="404" width="64" height="44" fill="#fff7e6" stroke="#d97706" stroke-width="1.5"/>
  <text x="348" y="432" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">2</text>
