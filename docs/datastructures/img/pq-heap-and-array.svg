  <circle cx="510" cy="212" r="26" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="510" y="218" text-anchor="middle" font-size="18" font-family="Consolas, monospace" fill="#1c2333">2</text>
  <text x="510" y="178" text-anchor="middle" font-size="12" fill="#b45309" font-weight="600">индекс 2</text>
  <circle cx="160" cy="312" r="26" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
