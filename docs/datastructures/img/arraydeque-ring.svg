<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="360" fill="#fbfcfe"/>
  <defs>
    <marker id="wrap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#34a97a"/>
    </marker>
    <marker id="pt" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#4f8cff"/>
    </marker>
  </defs>

  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Как ArrayDeque устроен внутри: кольцевой массив</text>
  <text x="380" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Массив не сдвигается — двигаются индексы head и tail, заворачиваясь через конец</text>

  <!-- cells: 8 slots -->
  <g font-family="Consolas, monospace">
    <rect x="80" y="132" width="72" height="60" rx="8" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="116" y="169" text-anchor="middle" font-size="19" fill="#1c2333">C</text>
    <text x="116" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">0</text>

    <rect x="160" y="132" width="72" height="60" rx="8" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="196" y="169" text-anchor="middle" font-size="19" fill="#1c2333">D</text>
    <text x="196" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">1</text>

    <rect x="240" y="132" width="72" height="60" rx="8" fill="#f4f6fa" stroke="#cfd6e4" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="276" y="169" text-anchor="middle" font-size="14" fill="#a8b0c0">null</text>
    <text x="276" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">2</text>

    <rect x="320" y="132" width="72" height="60" rx="8" fill="#f4f6fa" stroke="#cfd6e4" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="356" y="169" text-anchor="middle" font-size="14" fill="#a8b0c0">null</text>
    <text x="356" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">3</text>

    <rect x="400" y="132" width="72" height="60" rx="8" fill="#f4f6fa" stroke="#cfd6e4" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="436" y="169" text-anchor="middle" font-size="14" fill="#a8b0c0">null</text>
    <text x="436" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">4</text>

    <rect x="480" y="132" width="72" height="60" rx="8" fill="#f4f6fa" stroke="#cfd6e4" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="516" y="169" text-anchor="middle" font-size="14" fill="#a8b0c0">null</text>
    <text x="516" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">5</text>

    <rect x="560" y="132" width="72" height="60" rx="8" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="596" y="169" text-anchor="middle" font-size="19" fill="#1c2333">A</text>
    <text x="596" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">6</text>

    <rect x="640" y="132" width="72" height="60" rx="8" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="676" y="169" text-anchor="middle" font-size="19" fill="#1c2333">B</text>
    <text x="676" y="210" text-anchor="middle" font-size="11.5" fill="#6b7280">7</text>
  </g>

  <!-- head pointer -->
  <line x1="596" y1="106" x2="596" y2="126" stroke="#4f8cff" stroke-width="2" marker-end="url(#pt)"/>
  <text x="596" y="98" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Consolas, monospace" fill="#4f8cff">head = 6</text>

  <!-- tail pointer -->
  <line x1="276" y1="106" x2="276" y2="126" stroke="#4f8cff" stroke-width="2" marker-end="url(#pt)"/>
  <text x="276" y="98" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Consolas, monospace" fill="#4f8cff">tail = 2</text>

  <!-- wrap arrow -->
  <path d="M700,232 C700,272 600,282 396,282 C192,282 116,272 116,232"
        fill="none" stroke="#34a97a" stroke-width="2.2" marker-end="url(#wrap)"/>
  <text x="396" y="302" text-anchor="middle" font-size="12.5" fill="#34a97a">после индекса 7 идёт индекс 0 — массив замкнут в кольцо</text>

  <text x="380" y="332" text-anchor="middle" font-size="12.5" fill="#6b7280">Логический порядок элементов: A → B → C → D. Ни одного сдвига при добавлении и снятии.</text>
</svg>
