<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="320" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Подъём: offer кладёт элемент в конец и поднимает его</text>
