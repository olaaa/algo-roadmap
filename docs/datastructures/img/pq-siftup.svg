  <text x="651" y="230" text-anchor="middle" font-size="16" font-family="Consolas, monospace" fill="#1c2333">8</text>
  <text x="625" y="272" text-anchor="middle" font-size="13" fill="#6b7280">«2» не меньше «1» —</text>
  <text x="625" y="292" text-anchor="middle" font-size="13" fill="#6b7280">подъём закончен</text>
