<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="400" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Те же пять значений: просто дерево и дерево поиска</text>
  <text x="190" y="62" text-anchor="middle" font-size="13" fill="#6b7280">[3, 9, 20, null, null, 15, 7] — правило порядка нарушено</text>
  <text x="570" y="62" text-anchor="middle" font-size="13" fill="#6b7280">[7, 3, 15, null, null, 9, 20] — дерево поиска</text>
  <line x1="380" y1="75" x2="380" y2="330" stroke="#d8dde8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="155" y1="126" x2="95" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="185" y1="126" x2="245" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="250" y1="219" x2="218" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="270" y1="219" x2="302" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="170" cy="110" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="170" y="116" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">3</text>
  <circle cx="80" cy="200" r="22" fill="#fff7e6" stroke="#d97706" stroke-width="3"/>
  <text x="80" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">9</text>
  <circle cx="260" cy="200" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="260" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">20</text>
  <circle cx="210" cy="290" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="210" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">15</text>
  <circle cx="310" cy="290" r="22" fill="#fff7e6" stroke="#d97706" stroke-width="3"/>
  <text x="310" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">7</text>
  <line x1="535" y1="126" x2="475" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="565" y1="126" x2="625" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="630" y1="219" x2="598" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="650" y1="219" x2="682" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="550" cy="110" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="550" y="116" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">7</text>
  <circle cx="460" cy="200" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="460" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">3</text>
  <circle cx="640" cy="200" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="640" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">15</text>
  <circle cx="590" cy="290" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="590" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">9</text>
  <circle cx="690" cy="290" r="22" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
  <text x="690" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">20</text>
  <text x="190" y="345" text-anchor="middle" font-size="12" fill="#b45309">«9» больше корня «3», а стоит слева;</text>
  <text x="190" y="365" text-anchor="middle" font-size="12" fill="#b45309">«7» меньше «20», а стоит справа</text>
  <text x="570" y="345" text-anchor="middle" font-size="12" fill="#1d9e75">слева от каждого узла — меньшие, справа — большие</text>
  <text x="570" y="365" text-anchor="middle" font-size="12" fill="#1d9e75">симметричный обход: 3, 7, 9, 15, 20</text>
