<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="460" fill="#fbfcfe"/>
  <text x="380" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Два дерева поиска из одних значений: форма зависит от порядка вставки</text>
  <text x="190" y="62" text-anchor="middle" font-size="13" fill="#6b7280">вставка 3, 7, 9, 15, 20 по порядку: h = 5</text>
  <text x="570" y="62" text-anchor="middle" font-size="13" fill="#6b7280">середина — корень: h = 3</text>
  <line x1="380" y1="75" x2="380" y2="420" stroke="#d8dde8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="122" y1="118" x2="148" y2="152" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="172" y1="188" x2="198" y2="222" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="222" y1="258" x2="248" y2="292" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="272" y1="328" x2="298" y2="362" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="110" cy="100" r="22" fill="#fcebeb" stroke="#e24b4a" stroke-width="2"/>
  <text x="110" y="106" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">3</text>
  <circle cx="160" cy="170" r="22" fill="#fcebeb" stroke="#e24b4a" stroke-width="2"/>
  <text x="160" y="176" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">7</text>
  <circle cx="210" cy="240" r="22" fill="#fcebeb" stroke="#e24b4a" stroke-width="2"/>
  <text x="210" y="246" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">9</text>
  <circle cx="260" cy="310" r="22" fill="#fcebeb" stroke="#e24b4a" stroke-width="2"/>
  <text x="260" y="316" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">15</text>
  <circle cx="310" cy="380" r="22" fill="#fcebeb" stroke="#e24b4a" stroke-width="2"/>
  <text x="310" y="386" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">20</text>
  <text x="150" y="420" font-size="12" fill="#a32d2d">поиск «20» — пять шагов, как в списке</text>
  <line x1="555" y1="126" x2="495" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="585" y1="126" x2="645" y2="184" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="490" y1="219" x2="512" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="670" y1="219" x2="692" y2="271" stroke="#9aa3b5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="570" cy="110" r="22" fill="#e1f5ee" stroke="#1d9e75" stroke-width="2"/>
  <text x="570" y="116" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">9</text>
  <circle cx="480" cy="200" r="22" fill="#e1f5ee" stroke="#1d9e75" stroke-width="2"/>
  <text x="480" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">3</text>
  <circle cx="660" cy="200" r="22" fill="#e1f5ee" stroke="#1d9e75" stroke-width="2"/>
  <text x="660" y="206" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">15</text>
  <circle cx="520" cy="290" r="22" fill="#e1f5ee" stroke="#1d9e75" stroke-width="2"/>
  <text x="520" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">7</text>
  <circle cx="700" cy="290" r="22" fill="#e1f5ee" stroke="#1d9e75" stroke-width="2"/>
  <text x="700" y="296" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">20</text>
  <text x="590" y="420" text-anchor="middle" font-size="12" fill="#0f6e56">поиск «20» — три шага: 9, 15, 20</text>
  <text x="380" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Оба дерева — деревья поиска: слева меньше, справа больше. Сбалансировано только правое.</text>
</svg>
