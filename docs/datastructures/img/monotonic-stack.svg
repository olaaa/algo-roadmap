<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="760" height="470" fill="#fbfcfe"/>

  <text x="380" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#1c2333">Монотонный стек: «следующий больший элемент»</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Вход [2, 1, 5, 3] · в стеке лежат те, кто ещё ждёт своего большего</text>

  <!-- input array -->
  <g font-family="Consolas, monospace">
    <rect x="248" y="70" width="60" height="46" rx="8" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="278" y="100" text-anchor="middle" font-size="18" fill="#1c2333">2</text>
    <rect x="316" y="70" width="60" height="46" rx="8" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="346" y="100" text-anchor="middle" font-size="18" fill="#1c2333">1</text>
    <rect x="384" y="70" width="60" height="46" rx="8" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="414" y="100" text-anchor="middle" font-size="18" fill="#1c2333">5</text>
    <rect x="452" y="70" width="60" height="46" rx="8" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.8"/>
    <text x="482" y="100" text-anchor="middle" font-size="18" fill="#1c2333">3</text>
  </g>

  <!-- step 1 -->
  <g>
    <text x="98" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2333">шаг 1 · x = 2</text>
    <rect x="58" y="252" width="80" height="40" rx="7" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="98" y="278" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">2</text>
    <text x="98" y="316" text-anchor="middle" font-size="11.5" fill="#6b7280">стек пуст —</text>
    <text x="98" y="332" text-anchor="middle" font-size="11.5" fill="#6b7280">просто кладём</text>
  </g>

  <!-- step 2 -->
  <g>
    <text x="268" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2333">шаг 2 · x = 1</text>
    <rect x="228" y="206" width="80" height="40" rx="7" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="268" y="232" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">1</text>
    <rect x="228" y="252" width="80" height="40" rx="7" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.6"/>
    <text x="268" y="278" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">2</text>
    <text x="268" y="316" text-anchor="middle" font-size="11.5" fill="#6b7280">1 &lt; 2 — порядок</text>
    <text x="268" y="332" text-anchor="middle" font-size="11.5" fill="#6b7280">не нарушен, кладём</text>
  </g>

  <!-- step 3 -->
  <g>
    <text x="438" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2333">шаг 3 · x = 5</text>
    <rect x="398" y="206" width="80" height="40" rx="7" fill="#fde8ee" stroke="#e0567a" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="438" y="232" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#e0567a" text-decoration="line-through">1</text>
    <rect x="398" y="252" width="80" height="40" rx="7" fill="#fde8ee" stroke="#e0567a" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="438" y="278" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#e0567a" text-decoration="line-through">2</text>
    <text x="438" y="316" text-anchor="middle" font-size="11.5" fill="#e0567a">5 больше обоих —</text>
    <text x="438" y="332" text-anchor="middle" font-size="11.5" fill="#e0567a">снимаем, ответ обоим 5</text>
    <rect x="398" y="352" width="80" height="40" rx="7" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="438" y="378" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">5</text>
    <text x="438" y="410" text-anchor="middle" font-size="11.5" fill="#6b7280">затем кладём 5</text>
  </g>

  <!-- step 4 -->
  <g>
    <text x="638" y="164" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1c2333">шаг 4 · x = 3</text>
    <rect x="598" y="206" width="80" height="40" rx="7" fill="#e8f0ff" stroke="#4f8cff" stroke-width="2"/>
    <text x="638" y="232" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">3</text>
    <rect x="598" y="252" width="80" height="40" rx="7" fill="#eef2f9" stroke="#b9c2d4" stroke-width="1.6"/>
    <text x="638" y="278" text-anchor="middle" font-size="17" font-family="Consolas, monospace" fill="#1c2333">5</text>
    <text x="638" y="316" text-anchor="middle" font-size="11.5" fill="#6b7280">3 &lt; 5 — кладём.</text>
    <text x="638" y="332" text-anchor="middle" font-size="11.5" fill="#6b7280">Оставшимся ответ −1</text>
  </g>

  <line x1="40" y1="432" x2="720" y2="432" stroke="#dfe4ec" stroke-width="1.5"/>
  <text x="380" y="456" text-anchor="middle" font-size="12.5" fill="#6b7280">Стек всегда убывает сверху вниз. Каждый элемент кладётся и снимается ровно один раз → O(n).</text>
</svg>
